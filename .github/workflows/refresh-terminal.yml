name: Refresh terminal card

on:
  schedule:
    # Atualiza o cartão uma vez ao dia; só cria commit quando houver mudança.
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_terminal.py
      - .github/workflows/refresh-terminal.yml

concurrency:
  group: profile-terminal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Render terminal card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render_terminal.py
      - name: Commit refreshed card
        run: |
          if git diff --quiet -- assets/terminal.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/terminal.svg
          git commit -m 'chore: atualiza atividade pública do perfil'
          git push
